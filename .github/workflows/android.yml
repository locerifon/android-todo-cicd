name: Android CI/CD Build & Distribute

on:
  push:
    branches: [ main, "release/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android App
    runs-on: ubuntu-latest

    steps:
    # 1. Получение исходного кода
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Установка Java Development Kit (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Установка Gradle и права
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Setup gradlew permissions
      run: chmod +x gradlew

    # 4. Установка Ruby и Fastlane
    - name: Set up Ruby for Fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install Fastlane gems
      run: |
        gem install bundler
        bundle install || true

    # 5. Проверка версионирования
    - name: Check Git Version
      run: |
        echo "=== Автоматический инкремент версии сборки ==="
        echo "Количество коммитов: $(git rev-list --count HEAD)"

    # 6. Декодирование Keystore из секретов GitHub (Code Signing)
    - name: Decode Signing Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          echo "Ключ подписи успешно расшифрован из GitHub Secrets."
        else
          echo "Секрет ANDROID_KEYSTORE_BASE64 не задан, используется тестовая подпись."
        fi

    # 7. Сборка релизного APK
    - name: Assemble Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace --no-daemon

    # 8. Сборка Bundle (AAB) для Google Play
    - name: Build Android App Bundle (.aab)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleRelease --stacktrace --no-daemon

    # 9. Загрузка APK в артефакты сборки
    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    # 10. Загрузка AAB в артефакты сборки
    - name: Upload Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/*.aab
        if-no-files-found: warn

    # 11. Доставка через Fastlane
    - name: Run Fastlane Distribution
      continue-on-error: true
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      run: |
        bundle exec fastlane distribute || true
