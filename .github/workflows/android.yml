name: Android CI/CD Build & Distribute

on:
  push:
    branches: [ main, "release/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android App
    runs-on: ubuntu-latest

    steps:
    # 1. Получение исходного кода
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Установка Java Development Kit (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Установка Gradle 8.5 и генерация Wrapper
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Wrapper Jar if missing
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    # 4. Установка Ruby и Fastlane
    - name: Set up Ruby for Fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install Fastlane gems
      run: |
        gem install bundler
        bundle install

    # 5. Задание Б: Управление версиями (Version Bumping)
    - name: Bump Version Code & Name (Задание Б)
      run: |
        echo "=== Автоматический инкремент версии сборки ==="
        BUILD_NUM=${{ github.run_number }}
        sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" app/build.gradle
        sed -i "s/versionName \"1.0.0\"/versionName \"1.0.$BUILD_NUM\"/g" app/build.gradle
        echo "Новая версия: versionCode=$BUILD_NUM, versionName=1.0.$BUILD_NUM"

    # 6. Задание В: Декодирование Keystore из секретов GitHub (Code Signing)
    - name: Decode Signing Keystore (Задание В)
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          echo "KEYSTORE_PATH=keystore.jks" >> $GITHUB_ENV
          echo "Ключ подписи успешно расшифрован из GitHub Secrets."
        else
          echo "Секрет ANDROID_KEYSTORE_BASE64 не задан, используется тестовая подпись."
        fi

    # 7. Сборка релизного APK
    - name: Assemble Release APK
      run: ./gradlew assembleRelease --no-daemon

    # 8. Задание А: Сборка Bundle (AAB) для Google Play
    - name: Build Android App Bundle (.aab) (Задание А)
      run: ./gradlew bundleRelease --no-daemon

    # 9. Загрузка APK в артефакты сборки
    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    # 10. Загрузка AAB в артефакты сборки (Задание А)
    - name: Upload Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/*.aab
        if-no-files-found: warn

    # 11. Доставка через Fastlane в Firebase App Distribution
    - name: Run Fastlane Distribution
      continue-on-error: true
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      run: |
        bundle exec fastlane distribute
