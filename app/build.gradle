plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def getCommitCount() {
    try {
        def process = new ProcessBuilder("git", "rev-list", "--count", "HEAD")
            .redirectErrorStream(true).start()
        return process.inputStream.text.trim().toInteger()
    } catch (Exception ignored) {
        return 1
    }
}

android {
    namespace "com.locerifon.todo"
    compileSdk 34

    defaultConfig {
        applicationId "com.locerifon.todo"
        minSdk 24
        targetSdk 33
        versionCode getCommitCount()
        versionName "2.1.${getCommitCount()}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "password123"
            keyAlias System.getenv("KEY_ALIAS") ?: "key0"
            keyPassword System.getenv("KEY_PASSWORD") ?: "password123"
        }
    }

    buildTypes {
        release {
            if (file("keystore.jks").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
