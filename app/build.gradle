plugins {
    id 'com.android.application'
    // Если проект на Kotlin, раскомментируй следующую строку:
    // id 'org.jetbrains.kotlin.android'
    // Для Задания Б (Firebase Remote Config) потребуется плагин google-services:
    // id 'com.google.gms.google-services'
}

android {
    namespace "com.locerifon.todo"
    compileSdk 36

    defaultConfig {
        applicationId "com.locerifon.todo"
        minSdk 24
        targetSdk 33
        versionCode 42
        versionName "2.1.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "password"
            keyAlias System.getenv("KEY_ALIAS") ?: "alias"
            keyPassword System.getenv("KEY_PASSWORD") ?: "password"
        }
    }

   buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Зависимости для Задания Б (Firebase Remote Config)
    // implementation platform('com.google.firebase:firebase-bom:32.7.0')
    // implementation 'com.google.firebase:firebase-config'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
